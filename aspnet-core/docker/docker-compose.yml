services:
  abp_host:
    image: mosaictalent_web_host:latest
    build:
      context: ..
      dockerfile: src/MosaicTalent.Web.Host/Dockerfile
    env_file:
      - ../src/MosaicTalent.Web.Host/.env
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ConnectionStrings__Default: "${ConnectionStrings__Default}"
      App__ServerRootAddress: "http://localhost:44311/"
      App__ClientRootAddress: "http://localhost:3000/"
      App__CorsOrigins: "http://localhost:3000"
      Authentication__JwtBearer__SecurityKey: "${Authentication__JwtBearer__SecurityKey}"
      GitHubApp__PrivateKeyPem: "${GitHubApp__PrivateKeyPem}"
      GitHubApp__WebhookSecret: "${GitHubApp__WebhookSecret}"
      GitHubApp__Name: "${GitHubApp__Name}"
      GitHubApp__AppId: "${GitHubApp__AppId}"
      GitHub__ClientId: "${GitHub__ClientId}"
      GitHub__ClientSecret: "${GitHub__ClientSecret}"
      GitHubOAuth__ClientId: "${GitHubOAuth__ClientId}"
      GitHubOAuth__ClientSecret: "${GitHubOAuth__ClientSecret}"
      GitHubOAuth__RedirectUri: "${GitHubOAuth__RedirectUri}"
      GitHub__RedirectUri: "${GitHub__RedirectUri:-http://localhost:44311/api/TokenAuth/GitHubCallback}"
      Groq__ApiKey: "${Groq__ApiKey}"
      Groq__Model: "${Groq__Model:-llama-3.3-70b-versatile}"
      Brevo__ApiKey: "${Brevo__ApiKey}"
      Vercel__Token: "${Vercel__Token}"
      R2__AccountId: "${R2__AccountId}"
      R2__AccessKeyId: "${R2__AccessKeyId}"
      R2__SecretAccessKey: "${R2__SecretAccessKey}"
      R2__BucketName: "${R2__BucketName}"
      R2__PublicBaseUrl: "${R2__PublicBaseUrl}"
      TZ: "${TZ:-America/Toronto}"
      PORT: "${PORT:-80}"
      Kestrel__Endpoints__Http__Url: "http://+:80"
    ports:
      - "44311:80"
    volumes:
      - "./Host-Logs:/app/App_Data/Logs"
      - "${LOCAL_OUTPUT_PATH:-./LocalOutput}:/app/LocalOutput"
    restart: always
